    matched the Energy & Utilities regime; TrickyBird is a consumer web proxy and apis.io already reads industries
    [cybersecurity], areas [privacy]. (3) The provider does not describe itself with "Anonymity". (4) https://trickybird.com/.well-known/security.txt
    (200) carries Contact, Expires, Preferred-Languages and Canonical, and no Policy field. (5) dig TXT _dmarc.trickybird.com
    returns "v=DMARC1; p=quarantine; np=reject; rua=mailto:dmarc@trickybird.com; fo=1"; the HSTS header is max-age=31536000;
