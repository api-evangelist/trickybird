    publishes no HTTP API for third parties; the one catalog entry is its agent surface (llms.txt + in-page WebMCP).
    (8) https://apis.io/api/v1/apis/trickybird-agent-surface returns 404; /api/v1/apis/trickybird:trickybird-agent-surface
    returns 200. An invented path on trickybird.com returns a real 404.'
