name: TrickyBird
description: >-
  Free web proxy to open blocked sites in a normal browser tab with no account and no install. Exposes agent-native
  surfaces only: an llms.txt and an in-page WebMCP tool surface (12 named tools across specific pages, as listed in the ItemList JSON-LD at
  https://trickybird.com/webmcp). It publishes no HTTP API for third parties.
