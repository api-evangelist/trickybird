name: TrickyBird WebMCP (in-page browser-tab tools)
status: experimental
note: >-
  TrickyBird's only agent surface: WebMCP tools its own pages register into
  document.modelContext in a compatible Chromium tab. This is NOT a hosted or local MCP server —
  the tools exist only while a TrickyBird page is open in Chrome 149-156 (origin trial token
  carried by this origin) or a Chrome launched with --enable-features=WebMCP; Firefox and Safari
  have no document.modelContext. Clients read tools with document.modelContext.getTools() and
  call document.modelContext.executeTool(). The provider serves no /.well-known/webmcp.json
  manifest (probed 404 2026-09-10); the tool surface is documented in prose at /webmcp. The
  gateway refuses WebMCP on every document it proxies, so a page opened THROUGH TrickyBird can
  register no tools — only TrickyBird's own first-party pages carry them. The /webmcp reference
  enumerates 12 distinct tool names (recorded below), registered 17 times across 10 page patterns;
  its ItemList JSON-LD carries numberOfItems 12 (re-checked 2026-10-05). The earlier "13 named
  tools" came from our own description, not from any TrickyBird page (api-evangelist/trickybird#1).
deployment:
  mode: none
  transport: in-page (WebMCP / document.modelContext)
  auth: none
  verified: searched
  note: >-
    No remote MCP endpoint an agent can POST to and no stdio package to install; recorded so the
    in-page surface is not conflated with a hosted MCP server.
tool_count: 12
registrations: 17
all_tools_no_auth: true
